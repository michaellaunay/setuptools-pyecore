[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setuptools-pyecore"
version = "0.2.0"
description = "Setuptools command for generating Python code from PyEcore models."
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Andreas Schmidl", email = "Andreas.Schmidl@gmail.com"}]
dependencies = ["setuptools>=83.0.0", "pyecore", "pyecoregen"]
keywords = ["setuptools", "model", "metamodel", "EMF", "Ecore", "code generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/pyecore/setuptools-pyecore"

[project.entry-points."distutils.commands"]
pyecore = "setuptools_pyecore.command:PyEcoreCommand"

[project.optional-dependencies]
test = ["pytest>=9.0.3", "build>=1"]

[tool.setuptools.packages.find]
include = ["setuptools_pyecore*"]
